name: flight-map-local

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flight_map}
      POSTGRES_USER: ${POSTGRES_USER:-flight_map}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flight_map_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - flight-map-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-flight_map} -d ${POSTGRES_DB:-flight_map}",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  flight-map-postgres:
