name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test, lint, and build
        run: |
          export DATABASE_URL="postgresql:${CI_DATABASE_TARGET}"
          npm run check
        env:
          CI_DATABASE_TARGET: //127.0.0.1:5432/flight_map_ci_build
          AUTH_SECRET: ci-build-only-${{ github.sha }}
          AUTH_URL: http://127.0.0.1:3000
