name: Vercel production candidate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a review artifact or deploy an approved artifact
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - deploy
      reviewed_commit_sha:
        description: Exact independently reviewed main commit
        required: true
        type: string
      candidate_manifest_sha256:
        description: Exact independently reviewed candidate manifest SHA-256
        required: true
        type: string
      approval_run_id:
        description: Independent vercel-release-approval workflow run ID
        required: true
        type: string
      prepared_run_id:
        description: Prepare workflow run ID (required only for deploy)
        required: false
        type: string
      prebuilt_artifact_manifest_sha256:
        description: Reviewed prebuilt artifact SHA-256 (required only for deploy)
        required: false
        type: string

permissions: {}

jobs:
  production-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Giffdev/waypointer' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: vercel-production
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download independent manual approval
        uses: actions/download-artifact@v4
        with:
          name: vercel-release-approval-${{ inputs.approval_run_id }}
          path: artifacts/release-approval
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.approval_run_id }}

      - name: Validate independent manual approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REQUESTER: ${{ github.actor }}
          OPERATION: ${{ inputs.operation }}
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
          CANDIDATE_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREBUILT_SHA256: ${{ inputs.prebuilt_artifact_manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVAL_RUN_ID" =~ ^[0-9]+$ ]]
          APPROVAL_FILE="artifacts/release-approval/approval.json"
          test -f "$APPROVAL_FILE"
          APPROVER="$(
            jq -er \
              --arg operation "$OPERATION" \
              --arg approvalRunId "$APPROVAL_RUN_ID" \
              --arg commit "$REVIEWED_COMMIT_SHA" \
              --arg candidate "$CANDIDATE_SHA256" \
              --arg prepared "$PREPARED_RUN_ID" \
              --arg prebuilt "$PREBUILT_SHA256" \
              '
                select(
                  .schemaVersion == 1 and
                  .repository == "Giffdev/waypointer" and
                  .workflowRef == "refs/heads/main" and
                  .workflowCommitSha == $commit and
                  .approvalRunId == $approvalRunId and
                  .operation == $operation and
                  .reviewedCommitSha == $commit and
                  .candidateManifestSha256 == $candidate and
                  .preparedRunId == $prepared and
                  .prebuiltArtifactManifestSha256 == $prebuilt
                ) |
                .approver |
                select(type == "string" and length > 0)
              ' "$APPROVAL_FILE"
          )"
          # Waypointer has one collaborator (the repository owner); this
          # replaces the impossible distinct-second-identity requirement.
          test "$REQUESTER" = "$REPOSITORY_OWNER"
          test "$APPROVER" = "$REPOSITORY_OWNER"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$REPOSITORY/actions/runs/$APPROVAL_RUN_ID" |
            jq -e \
              --arg approver "$APPROVER" \
              --arg commit "$REVIEWED_COMMIT_SHA" \
              '
                .event == "workflow_dispatch" and
                .path == ".github/workflows/vercel-release-approval.yml" and
                .head_branch == "main" and
                .head_sha == $commit and
                .actor.login == $approver and
                .status == "completed" and
                .conclusion == "success"
              ' >/dev/null
          rm -rf artifacts/release-approval

      - name: Check out reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate reviewed inputs
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          WORKFLOW_COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
          REVIEWED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
          CANDIDATE_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREBUILT_SHA256: ${{ inputs.prebuilt_artifact_manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APPROVAL_RUN_ID" =~ ^[0-9]+$ ]]
          test "$WORKFLOW_REPOSITORY" = "Giffdev/waypointer"
          test "$WORKFLOW_REF" = "refs/heads/main"
          test "$REVIEWED_COMMIT_SHA" = "$WORKFLOW_COMMIT_SHA"
          test "$REVIEWED_COMMIT_SHA" = "$(git rev-parse HEAD)"
          test "$REVIEWED_COMMIT_SHA" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [[ "$OPERATION" == "deploy" ]]; then
            [[ "$PREPARED_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$PREBUILT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.9.2

      - name: Prepare reviewed prebuilt artifact
        if: inputs.operation == 'prepare'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FLIGHT_MAP_APPROVED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
          AIRPORT_RELEASE_CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          FLIGHT_MAP_DEPLOY_PREPARE_ONLY: "true"
        run: npm run deploy:production

      - name: Upload artifact for independent review
        if: inputs.operation == 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-prebuilt-${{ inputs.reviewed_commit_sha }}
          path: |
            .vercel/output/**
            artifacts/release-evidence/airport-catalog/candidate-*.json
            artifacts/release-evidence/vercel-prebuilt-artifact/manifest-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Download independently reviewed artifact
        if: inputs.operation == 'deploy'
        uses: actions/download-artifact@v4
        with:
          name: vercel-prebuilt-${{ inputs.reviewed_commit_sha }}
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepared_run_id }}

      - name: Restore fixed Vercel project linkage
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_1XEu7EWNl1Eekl3TKQ6FnKnGznv8","orgId":"team_qymLK9gugmE5lSs2mxC5XqRY"}' > .vercel/project.json

      - name: Deploy exact immutable production candidate
        if: inputs.operation == 'deploy'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FLIGHT_MAP_APPROVED_COMMIT_SHA: ${{ inputs.reviewed_commit_sha }}
          AIRPORT_RELEASE_CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          FLIGHT_MAP_APPROVED_PREBUILT_ARTIFACT_MANIFEST_SHA256: ${{ inputs.prebuilt_artifact_manifest_sha256 }}
          FLIGHT_MAP_USE_EXISTING_PREBUILT: "true"
        run: npm run deploy:production

      - name: Upload redacted deployment evidence
        if: inputs.operation == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-production-candidate-evidence
          path: |
            artifacts/release-evidence/vercel-deployment/production-candidate-*.json
            data/private/release-approvals/vercel-provider-expectation-*.json
          if-no-files-found: error
          retention-days: 14
